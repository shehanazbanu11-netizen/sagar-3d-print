backend:
  name: git-gateway
  branch: main

media_folder: "images/products"
public_folder: "images/products"

collections:
  - name: "products"
    label: "Products"
    files:
      - file: "products.json"
        label: "Product Catalog"
        name: "catalog"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — ₹{{fields.price}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (INR)", name: "price", widget: "number", value_type: "int" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Pooja & Decor"
                  - "Home Decor"
                  - "Keyrings & Bag Tags"
                  - "Workspace"
                  - "Gifting"
                  - "Custom Orders"
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "In stock", name: "inStock", widget: "boolean", default: true }
